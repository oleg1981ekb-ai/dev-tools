name: PDF Excel Compare CI

on:
  push:
    paths: [ 'PDF_Excel_compare/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'PDF_Excel_compare/**' ]
  workflow_dispatch:

defaults:
  run:
    working-directory: PDF_Excel_compare

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest -q
